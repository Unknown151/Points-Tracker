<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0f">
<title>Battle Points Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0d0d0f;
  --bg2:       #141417;
  --bg3:       #1a1a1f;
  --border:    #2a2a32;
  --text:      #e8e6e0;
  --text2:     #b8b4aa;
  --text3:     #706c62;
  --gold:      #d4a84b;
  --gold-bright: #e8c060;
  --gold-dark: #8a6820;
  --border-gold: rgba(212,168,75,.3);
}

[data-theme="light"] {
  --bg:        #ecebe6;
  --bg2:       #ffffff;
  --bg3:       #f4f3ee;
  --border:    #d6d3c8;
  --text:      #1a1a1f;
  --text2:     #44423a;
  --text3:     #8a877c;
  --gold:      #a97f1f;
  --gold-bright: #8a6820;
  --gold-dark: #c9a648;
  --border-gold: rgba(169,127,31,.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Orbitron', sans-serif;
  min-height: 100vh;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 0;
}

/* ── Header ───────────────────────────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .75rem 1rem;
  background: var(--bg2);
  border-bottom: 1px solid var(--border-gold);
}
.app-header h1 {
  font-size: .95rem;
  font-weight: 900;
  letter-spacing: .12em;
  color: var(--gold-bright);
  text-transform: uppercase;
}
.header-actions { display: flex; gap: .4rem; }
.icon-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--gold);
  font-size: 1.1rem;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.icon-btn:active { border-color: var(--gold); }

/* ── Main layout ──────────────────────── */
main {
  flex: 1;
  display: flex;
  align-items: stretch;
  gap: .75rem;
  padding: .75rem;
  width: 100%;
}
.left-col { flex: 1; display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
.sidebar { width: 72px; display: flex; flex-direction: column; flex-shrink: 0; }

/* ── Cards ────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

/* ── Total header card ────────────────── */
.total-card { display: flex; }
.total-half {
  flex: 1;
  padding: .75rem .5rem;
  text-align: center;
}
.total-half:first-child { border-right: 1px solid var(--border-gold); }
.total-label {
  font-size: .6rem;
  letter-spacing: .12em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: .25rem;
}
.total-value {
  font-family: 'Share Tech Mono', monospace;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold-bright);
  line-height: 1;
}
.total-cap {
  font-size: .7rem;
  color: var(--text3);
  cursor: pointer;
}
.total-cap:active { color: var(--gold); }

/* ── Tracker cards ────────────────────── */
.tracker {
  display: flex;
  flex-direction: column;
}
.pts-tracker-label {
  background: var(--bg3);
  border-bottom: 1px solid var(--border-gold);
  color: var(--gold);
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-align: center;
  padding: .5rem;
  cursor: pointer;
  width: 100%;
}
.pts-tracker-label:active { color: var(--gold-bright); }
.label-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  font-family: 'Orbitron', sans-serif;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-align: center;
  padding: .45rem .5rem;
}
.tracker-body {
  display: flex;
  align-items: stretch;
  padding: .65rem;
  gap: .5rem;
}
.btn-stack { display: flex; flex-direction: column; gap: .35rem; }
.pts-tracker-btn {
  width: 42px; height: 42px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  font-family: 'Orbitron', sans-serif;
  font-size: 1.35rem;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .12s, background .12s;
}
.pts-tracker-btn:active { border-color: var(--gold); background: var(--bg); }
.pts-tracker-btn-5 {
  width: 42px; height: 20px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text3);
  font-family: 'Share Tech Mono', monospace;
  font-size: .68rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .12s, color .12s;
}
.pts-tracker-btn-5:active { border-color: var(--gold); color: var(--gold); }
.tracker-value {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 2.6rem;
  font-weight: 700;
  color: var(--text);
}

/* ── Round sidebar ────────────────────── */
.sidebar .card {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--gold);
  text-transform: uppercase;
  text-align: center;
  padding: .5rem .25rem;
  background: var(--bg3);
  border-bottom: 1px solid var(--border-gold);
}
.round-rows { flex: 1; display: flex; flex-direction: column; }
.round-row {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .15rem;
  padding: .35rem .15rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}
.round-row:last-child { border-bottom: none; }
.round-row .rnum {
  font-size: .85rem;
  font-weight: 700;
  color: var(--text2);
}
.round-row .rtotal {
  font-family: 'Share Tech Mono', monospace;
  font-size: .8rem;
  color: var(--text3);
}
.round-row.active {
  background: rgba(212,168,75,.12);
}
.round-row.active .rnum { color: var(--gold-bright); }
.round-row.active .rtotal { color: var(--gold); }
.reset-btn {
  margin-top: .4rem;
  width: 100%;
  padding: .6rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text3);
  font-size: 1.1rem;
  cursor: pointer;
  transition: border-color .12s, color .12s;
}
.reset-btn:active { border-color: #a04040; color: #d06060; }

/* ── Footer ───────────────────────────── */
footer {
  padding: .9rem 1rem 1.2rem;
  text-align: center;
  font-size: .58rem;
  letter-spacing: .08em;
  color: var(--text3);
  border-top: 1px solid var(--border);
}
footer a { color: var(--text3); text-decoration: none; }
footer a:active { color: var(--gold); }

/* ── Settings modal ───────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 100;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 1rem;
}
.overlay.open { display: flex; }
.settings-panel {
  width: 100%;
  max-width: 420px;
  margin-top: 3.5rem;
  background: var(--bg2);
  border: 1px solid var(--border-gold);
  border-radius: 14px;
  overflow: hidden;
  animation: slideDown .18s ease;
}
@keyframes slideDown { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.settings-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: .85rem 1rem;
  background: var(--bg3);
  border-bottom: 1px solid var(--border-gold);
}
.settings-head h2 {
  font-size: .8rem; font-weight: 900; letter-spacing: .12em;
  color: var(--gold-bright); text-transform: uppercase;
}
.settings-body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.field { display: flex; flex-direction: column; gap: .35rem; }
.field label {
  font-size: .62rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text3); font-weight: 700;
}
.field input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: .95rem;
  padding: .6rem .65rem;
}
.field input:focus { outline: none; border-color: var(--gold); }
.seg { display: flex; gap: .4rem; }
.seg button {
  flex: 1;
  padding: .55rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  cursor: pointer;
}
.seg button.active { border-color: var(--gold); color: var(--gold-bright); background: rgba(212,168,75,.1); }

@media (min-width: 768px) {
  main, .app-header, footer { max-width: 600px; margin-left: auto; margin-right: auto; }
  .app-header { left: 0; right: 0; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1>Battle Points Tracker</h1>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☽</button>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<main>
  <div class="left-col">
    <!-- Total header -->
    <div class="card total-card">
      <div class="total-half">
        <div class="total-label">Primary</div>
        <div class="total-value" id="totalPrimary">0</div>
        <div class="total-cap" id="totalCap" title="Tap to edit cap">/50</div>
      </div>
      <div class="total-half">
        <div class="total-label">All Points</div>
        <div class="total-value" id="totalAll">0</div>
      </div>
    </div>

    <!-- Primary tracker -->
    <div class="card tracker">
      <div class="pts-tracker-label" data-type="primary" id="labelPrimary">Primary Objective Points</div>
      <div class="tracker-body">
        <div class="btn-stack">
          <button class="pts-tracker-btn-5" data-type="primary" data-delta="-5">−5</button>
          <button class="pts-tracker-btn" data-type="primary" data-delta="-1">−</button>
        </div>
        <div class="tracker-value" id="valPrimary">0</div>
        <div class="btn-stack">
          <button class="pts-tracker-btn-5" data-type="primary" data-delta="5">+5</button>
          <button class="pts-tracker-btn" data-type="primary" data-delta="1">+</button>
        </div>
      </div>
    </div>

    <!-- Secondary tracker -->
    <div class="card tracker">
      <div class="pts-tracker-label" data-type="secondary" id="labelSecondary">Secondary Objective Points</div>
      <div class="tracker-body">
        <div class="btn-stack">
          <button class="pts-tracker-btn-5" data-type="secondary" data-delta="-5">−5</button>
          <button class="pts-tracker-btn" data-type="secondary" data-delta="-1">−</button>
        </div>
        <div class="tracker-value" id="valSecondary">0</div>
        <div class="btn-stack">
          <button class="pts-tracker-btn-5" data-type="secondary" data-delta="5">+5</button>
          <button class="pts-tracker-btn" data-type="secondary" data-delta="1">+</button>
        </div>
      </div>
    </div>

    <!-- Bonus tracker -->
    <div class="card tracker">
      <div class="pts-tracker-label" data-type="bonus" id="labelBonus">Bonus Points</div>
      <div class="tracker-body">
        <div class="btn-stack">
          <button class="pts-tracker-btn-5" data-type="bonus" data-delta="-5">−5</button>
          <button class="pts-tracker-btn" data-type="bonus" data-delta="-1">−</button>
        </div>
        <div class="tracker-value" id="valBonus">0</div>
        <div class="btn-stack">
          <button class="pts-tracker-btn-5" data-type="bonus" data-delta="5">+5</button>
          <button class="pts-tracker-btn" data-type="bonus" data-delta="1">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Round sidebar -->
  <div class="sidebar">
    <div class="card">
      <div class="sidebar-header">Round</div>
      <div class="round-rows" id="roundRows"></div>
    </div>
    <button class="reset-btn" id="resetBtn" title="Reset all">↺</button>
  </div>
</main>

<footer>
  Battle Points Tracker · <a href="https://github.com/Unknown151/Points-Tracker" target="_blank" rel="noopener">github.com/Unknown151/Points-Tracker</a>
</footer>

<!-- Settings -->
<div class="overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-head">
      <h2>Settings</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close">✕</button>
    </div>
    <div class="settings-body">
      <div class="field">
        <label for="setCap">Primary Cap</label>
        <input type="number" id="setCap" min="0" inputmode="numeric">
      </div>
      <div class="field">
        <label for="setLabelP">Primary Label</label>
        <input type="text" id="setLabelP">
      </div>
      <div class="field">
        <label for="setLabelS">Secondary Label</label>
        <input type="text" id="setLabelS">
      </div>
      <div class="field">
        <label for="setLabelB">Bonus Label</label>
        <input type="text" id="setLabelB">
      </div>
      <div class="field">
        <label>Number of Rounds</label>
        <div class="seg" id="roundsSeg">
          <button data-rounds="3">3</button>
          <button data-rounds="4">4</button>
          <button data-rounds="5">5</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const STORAGE_KEY = 'bpt_state';
const THEME_KEY   = 'bpt_theme';

// ── State ──────────────────────────────
let primaryPts   = 0;
let secondaryPts = 0;
let bonusPts     = 0;
let currentRound = 1;
let roundStates  = {};   // { [round]: { primary, secondary } }

// Settings
let primaryCap     = 50;
let labelPrimary   = 'Primary Objective Points';
let labelSecondary = 'Secondary Objective Points';
let labelBonus     = 'Bonus Points';
let totalRounds    = 5;

// ── DOM refs ───────────────────────────
const $ = id => document.getElementById(id);

// ── Persistence ────────────────────────
function saveState() {
  const blob = {
    primaryPts, secondaryPts, bonusPts,
    currentRound, roundStates,
    primaryCap, labelPrimary, labelSecondary, labelBonus, totalRounds
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(blob)); } catch (e) {}
}

function loadState() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    primaryPts     = num(s.primaryPts);
    secondaryPts   = num(s.secondaryPts);
    bonusPts       = num(s.bonusPts);
    currentRound   = s.currentRound || 1;
    roundStates    = s.roundStates && typeof s.roundStates === 'object' ? s.roundStates : {};
    primaryCap     = (s.primaryCap === null || s.primaryCap === undefined) ? 50 : num(s.primaryCap);
    labelPrimary   = s.labelPrimary   || labelPrimary;
    labelSecondary = s.labelSecondary || labelSecondary;
    labelBonus     = s.labelBonus     || labelBonus;
    totalRounds    = s.totalRounds    || 5;
  } catch (e) {}
}

function num(v) { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; }

// ── Round logic ────────────────────────
function snapshotCurrent() {
  roundStates[currentRound] = { primary: primaryPts, secondary: secondaryPts };
}

function selectRound(n) {
  if (n === currentRound) return;
  snapshotCurrent();
  currentRound = n;
  const saved = roundStates[n];
  primaryPts   = saved ? num(saved.primary)   : 0;
  secondaryPts = saved ? num(saved.secondary) : 0;
  // bonus flows freely — not touched on round switch
  saveState();
  renderAll();
}

// Sum of primary across all saved rounds, excluding the given round.
function totalPrimaryAcrossRounds(excludeRound) {
  let sum = 0;
  for (const r in roundStates) {
    if (parseInt(r, 10) === excludeRound) continue;
    sum += num(roundStates[r].primary);
  }
  return sum;
}

function totalSecondaryAcrossRounds(excludeRound) {
  let sum = 0;
  for (const r in roundStates) {
    if (parseInt(r, 10) === excludeRound) continue;
    sum += num(roundStates[r].secondary);
  }
  return sum;
}

// ── Counter changes ────────────────────
function changePts(type, delta) {
  if (type === 'primary') {
    let next = primaryPts + delta;
    if (next < 0) next = 0;
    // enforce cap across all rounds combined
    if (primaryCap > 0) {
      const others = totalPrimaryAcrossRounds(currentRound);
      if (others + next > primaryCap) next = Math.max(0, primaryCap - others);
    }
    primaryPts = next;
  } else if (type === 'secondary') {
    secondaryPts = Math.max(0, secondaryPts + delta);
  } else if (type === 'bonus') {
    bonusPts = Math.max(0, bonusPts + delta);
  }
  // keep current round snapshot live so totals reflect immediately
  snapshotCurrent();
  saveState();
  renderAll();
}

// ── Render ─────────────────────────────
function renderAll() {
  $('valPrimary').textContent   = primaryPts;
  $('valSecondary').textContent = secondaryPts;
  $('valBonus').textContent     = bonusPts;

  $('labelPrimary').textContent   = labelPrimary;
  $('labelSecondary').textContent = labelSecondary;
  $('labelBonus').textContent     = labelBonus;

  const totalPrimary = totalPrimaryAcrossRounds(currentRound) + primaryPts;
  const totalSecondary = totalSecondaryAcrossRounds(currentRound) + secondaryPts;
  $('totalPrimary').textContent = totalPrimary;
  $('totalCap').textContent = primaryCap > 0 ? '/' + primaryCap : '/∞';
  $('totalAll').textContent = totalPrimary + totalSecondary + bonusPts;

  renderRounds();
}

function renderRounds() {
  const container = $('roundRows');
  container.innerHTML = '';
  for (let i = 1; i <= totalRounds; i++) {
    const row = document.createElement('div');
    row.className = 'round-row' + (i === currentRound ? ' active' : '');

    let total = null;
    if (i === currentRound) {
      total = primaryPts + secondaryPts;
    } else if (roundStates[i]) {
      total = num(roundStates[i].primary) + num(roundStates[i].secondary);
    }
    // a round is "untouched" if never snapshotted and not current with zero
    const touched = (i === currentRound) || !!roundStates[i];

    row.innerHTML =
      '<div class="rnum">' + i + '</div>' +
      '<div class="rtotal">' + (touched ? total : '—') + '</div>';
    row.addEventListener('click', () => selectRound(i));
    container.appendChild(row);
  }
}

// ── Reset ──────────────────────────────
function resetState() {
  if (!confirm('Reset all points and rounds?')) return;
  primaryPts = secondaryPts = bonusPts = 0;
  currentRound = 1;
  roundStates = {};
  saveState();
  renderAll();
}

// ── Editable labels ────────────────────
function makeLabelEditable(el, type) {
  el.addEventListener('click', () => {
    const current = el.textContent;
    const input = document.createElement('input');
    input.className = 'label-input';
    input.value = current;
    el.replaceWith(input);
    input.focus();
    input.select();

    const commit = () => {
      const v = input.value.trim() || current;
      if (type === 'primary')   labelPrimary = v;
      if (type === 'secondary') labelSecondary = v;
      if (type === 'bonus')     labelBonus = v;
      saveState();
      input.replaceWith(el);
      el.textContent = v;
      el.id = 'label' + type.charAt(0).toUpperCase() + type.slice(1);
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = current; input.blur(); }
    });
  });
}

// ── Editable cap (header) ──────────────
$('totalCap').addEventListener('click', () => {
  const v = prompt('Primary cap (0 = no cap):', primaryCap);
  if (v === null) return;
  const n = parseInt(v, 10);
  if (isNaN(n) || n < 0) return;
  primaryCap = n;
  // re-clamp current primary if over the combined cap
  if (primaryCap > 0) {
    const others = totalPrimaryAcrossRounds(currentRound);
    if (others + primaryPts > primaryCap) primaryPts = Math.max(0, primaryCap - others);
    snapshotCurrent();
  }
  saveState();
  renderAll();
});

// ── Settings panel ─────────────────────
function openSettings() {
  $('setCap').value    = primaryCap;
  $('setLabelP').value = labelPrimary;
  $('setLabelS').value = labelSecondary;
  $('setLabelB').value = labelBonus;
  document.querySelectorAll('#roundsSeg button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.rounds, 10) === totalRounds);
  });
  $('settingsOverlay').classList.add('open');
}
function closeSettings() {
  applySettings();
  $('settingsOverlay').classList.remove('open');
}
function applySettings() {
  const capRaw = parseInt($('setCap').value, 10);
  primaryCap = isNaN(capRaw) || capRaw < 0 ? 0 : capRaw;
  labelPrimary   = $('setLabelP').value.trim() || labelPrimary;
  labelSecondary = $('setLabelS').value.trim() || labelSecondary;
  labelBonus     = $('setLabelB').value.trim() || labelBonus;
  // re-clamp / drop out-of-range rounds
  if (currentRound > totalRounds) {
    snapshotCurrent();
    currentRound = totalRounds;
    const saved = roundStates[currentRound];
    primaryPts   = saved ? num(saved.primary)   : 0;
    secondaryPts = saved ? num(saved.secondary) : 0;
  }
  if (primaryCap > 0) {
    const others = totalPrimaryAcrossRounds(currentRound);
    if (others + primaryPts > primaryCap) primaryPts = Math.max(0, primaryCap - others);
  }
  snapshotCurrent();
  saveState();
  renderAll();
}

// ── Theme ──────────────────────────────
function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    $('themeBtn').textContent = '☀';
    document.querySelector('meta[name=theme-color]').setAttribute('content', '#ecebe6');
  } else {
    document.documentElement.removeAttribute('data-theme');
    $('themeBtn').textContent = '☽';
    document.querySelector('meta[name=theme-color]').setAttribute('content', '#0d0d0f');
  }
}
function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
}

// ── Wire up events ─────────────────────
document.querySelectorAll('.pts-tracker-btn, .pts-tracker-btn-5').forEach(btn => {
  btn.addEventListener('click', () => {
    changePts(btn.dataset.type, parseInt(btn.dataset.delta, 10));
  });
});
makeLabelEditable($('labelPrimary'), 'primary');
makeLabelEditable($('labelSecondary'), 'secondary');
makeLabelEditable($('labelBonus'), 'bonus');

$('settingsBtn').addEventListener('click', openSettings);
$('closeSettings').addEventListener('click', closeSettings);
$('settingsOverlay').addEventListener('click', e => {
  if (e.target === $('settingsOverlay')) closeSettings();
});
document.querySelectorAll('#roundsSeg button').forEach(b => {
  b.addEventListener('click', () => {
    totalRounds = parseInt(b.dataset.rounds, 10);
    document.querySelectorAll('#roundsSeg button').forEach(x =>
      x.classList.toggle('active', x === b));
    applySettings();
  });
});
$('resetBtn').addEventListener('click', resetState);
$('themeBtn').addEventListener('click', toggleTheme);

// ── Init ───────────────────────────────
loadState();
(function initTheme() {
  let t;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(t === 'light' ? 'light' : 'dark');
})();
// re-attach editable labels (ids may have been reset above)
renderAll();
</script>
</body>
</html>
